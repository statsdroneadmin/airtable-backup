# ─────────────────────────────────────────────────────────────────────────────
# plugin.yaml — airtable-backup
#
# Backs up an Airtable account (schema, records, attachment files, optional
# comments) into NousViz Postgres with a change log, and exports it back out
# as CSV / JSON. Read-only toward Airtable.
#
# Reference: docs/02-plugin-contract.md in the nousviz-plugin-authoring guide.
# ─────────────────────────────────────────────────────────────────────────────

# Identity ────────────────────────────────────────────────────────────────────
name: airtable-backup
display_name: Airtable Backup
version: 0.1.0
description: >
  Back up every Airtable base your token can see (schema, records, attachment
  files and optionally comments) with a change log, then browse or export it.

license: MIT
icon: database-backup                 # Lucide icon name. See lucide.dev/icons.
category: integration
tags: [airtable, backup, export, archive]
visibility: fully_private

publisher:
  slug: statsdroneadmin
  name: StatsDrone

repository: git@github.com:statsdroneadmin/airtable-backup.git


# Long description (Markdown) ─────────────────────────────────────────────────

long_description: |
  ## What this plugin does

  Keeps a complete, self-hosted copy of your Airtable account.

  - **Everything the token can see:** every base, every table's fields and
    views, and every record. Optionally limit it to named bases.
  - **Attachment files are downloaded**, not just linked: Airtable's
    attachment links expire 2 hours after they're issued.
  - **Change log:** every sync records which records were created, updated
    (with the previous values), deleted or restored. Deleted records stay in
    the backup.
  - **Schema history:** field and view changes are snapshotted.
  - **Export** any table as CSV or JSON, or a whole base as JSON.
  - **Read-only:** the plugin never writes to Airtable.

  ## Setup

  1. Create a Personal Access Token at airtable.com/create/tokens with scopes
     `data.records:read` and `schema.bases:read` (add
     `data.recordComments:read` to back up comments), and give it access to
     the bases or workspaces to back up.
  2. Settings → paste the token → **Test connection** → **Run sync**.
  3. The backup then refreshes daily at 03:00 UTC.


# Infrastructure requirements ─────────────────────────────────────────────────

requires:
  postgres: true
  postgres_version: "14"


# Connections ─────────────────────────────────────────────────────────────────

connections:
  - name: airtable
    type: api_key
    required: true
    label: Airtable
    description: >
      A Personal Access Token. Read-only use: the plugin never writes to Airtable.
    fields:
      - name: api_token
        label: Personal access token
        type: password
        secret: true
        required: true
        description: >
          From airtable.com/create/tokens. Scopes: data.records:read,
          schema.bases:read (+ data.recordComments:read for comments). Stored encrypted.
      - name: bases
        label: Bases to include
        type: text
        required: false
        description: >
          Comma-separated base names or IDs (app…). Leave blank to back up every
          base the token can see.
      - name: download_attachments
        label: Download attachment files
        type: select
        required: false
        default: "yes"
        description: >
          Store the attachment files themselves. Airtable's attachment links
          expire after 2 hours, so without this only file names are kept.
        options:
          - { label: "Yes", value: "yes" }
          - { label: "No (metadata only)", value: "no" }
      - name: max_attachment_mb
        label: Max attachment size (MB)
        type: number
        required: false
        default: 100
        description: Larger files are recorded but not downloaded.
      - name: include_comments
        label: Back up record comments
        type: select
        required: false
        default: "no"
        description: >
          One extra API call per record whose comments changed. Slow on large
          bases with many comments (Airtable allows 5 requests/second per base).
        options:
          - { label: "No", value: "no" }
          - { label: "Yes", value: "yes" }


# Databases ───────────────────────────────────────────────────────────────────

databases:
  postgres:
    table_prefix: atb_
    tables:
      - atb_runs
      - atb_bases
      - atb_tables
      - atb_schema_history
      - atb_records
      - atb_record_changes
      - atb_attachments
      - atb_comments


# Navigation ──────────────────────────────────────────────────────────────────
# Trailing slug must match a dashboards[].name.

navigation:
  - label: Airtable Backup
    path: /plugin/airtable-backup/overview
    icon: DatabaseBackup


# Dashboards ──────────────────────────────────────────────────────────────────

dashboards:
  - name: overview
    label: Overview
    file: dashboards/overview.yaml


# Sync ────────────────────────────────────────────────────────────────────────
# Full pass every run (Airtable has no "modified since" filter). Bases are
# processed least-recently-synced first, so a run that hits the timeout still
# advances the backup across runs.

sync:
  script: src/airtable_backup_sync.py
  schedule: "0 3 * * *"                 # daily 03:00 UTC
  supports_incremental: false
  execution_mode: async
  concurrency_policy: skip_if_running
  timeout_seconds: 14400                # 4 h


# Lifecycle hooks ─────────────────────────────────────────────────────────────

hooks:
  on_credentials_saved:   hooks.lifecycle:on_credentials_saved
  on_first_run_success:   hooks.lifecycle:on_first_run_success


# Declarative actions ─────────────────────────────────────────────────────────

actions:
  - id: test_connection
    label: Test connection
    slot: settings_tab_footer
    style: secondary
    icon: check-circle
    endpoint: POST /api/plugins/airtable-backup/test-connection
    disabled_when: no_credentials

  - id: run_sync
    label: Run sync
    slot: settings_tab_footer
    style: primary
    icon: download
    endpoint: POST /api/plugins/airtable-backup/sync-now
    confirm: "Back up Airtable now?"
    disabled_when: sync_in_progress


# Setup checklist ─────────────────────────────────────────────────────────────

setup_checklist:
  show_until: all_done
  items:
    - id: save_credentials
      label: Save your Airtable token
      done_if: credentials_saved
    - id: test_connection
      label: Verify connection — click "Test connection"
      done_if: last_test_success
    - id: first_sync
      label: Run the first backup
      done_if: first_sync_success
    - id: schedule_live
      label: Confirm the daily backup is scheduled
      done_if: schedule_active


# Frontend components ─────────────────────────────────────────────────────────
# trusted/needs_consent are required by core's install-response model.

frontend:
  trusted: false
  needs_consent: true
  components:
    - name: AirtableBackupApp
      path: widget/dist/AirtableBackupApp.js
