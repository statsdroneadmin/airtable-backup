# dashboards/overview.yaml — Airtable Backup: the single consolidated page.
#
# One custom React panel (AirtableBackupApp) renders totals, the base → table
# → record browser, the record drawer, exports and recent changes. It reads
# /api/plugins/airtable-backup/* through apiFetch.

title: Overview
db_engine: postgres

panels:
  - id: airtable_backup_app
    type: custom
    component: AirtableBackupApp
    config:
      title: Airtable Backup
